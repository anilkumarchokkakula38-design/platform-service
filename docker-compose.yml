version: '3.9'

services:
  platform-service:
    image: platform-service:${TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMMIT_SHA: ${COMMIT_SHA:-local}
    container_name: platform-service-local
    environment:
      SERVICE_NAME: ${SERVICE_NAME:-platform-service}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PORT: ${PORT:-8080}
      COMMIT_SHA: ${COMMIT_SHA:-local}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    ports:
      - "${PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8080}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - platform-network

networks:
  platform-network:
    driver: bridge
